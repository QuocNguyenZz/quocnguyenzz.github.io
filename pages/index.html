<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FSD50 Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: #e8edf0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  h1 { font-size: 2.2rem; margin-bottom: 0.4rem; letter-spacing: 1px; }
  p.sub { color: #9fb3c8; margin-bottom: 2.2rem; }
  .cards { display: flex; gap: 1.5rem; flex-wrap: wrap; justify-content: center; }
  .card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 14px;
    padding: 1.8rem 2.2rem;
    width: 260px;
    text-decoration: none;
    color: inherit;
    transition: transform .15s, background .15s, box-shadow .15s;
  }
  .card:hover { transform: translateY(-4px); background: rgba(255,255,255,0.12); box-shadow: 0 10px 25px rgba(0,0,0,0.35); }
  .card .ttl { font-size: 1.15rem; font-weight: 600; margin-bottom: .3rem; }
  .card .desc { font-size: .85rem; color: #9fb3c8; }
  footer { margin-top: 2.5rem; font-size: .78rem; color: #68809b; }
</style>
</head>
<body>
  <h1>FSD50 · Dashboard</h1>
  <p class="sub">Báo cáo tự động kho Mega Market — Store 10050</p>
  <div class="cards">
    <a class="card" href="Day%20Receive%20Detail%20Report.html">
      <div class="ttl">Day Receive Detail Report</div>
      <div class="desc">Báo cáo chi tiết nhận hàng / bù trừ / SC theo ngày</div>
    </a>
    <a class="card" href="RPT18%20Fillrate%20Report.html">
      <div class="ttl">RPT18 Fillrate Report</div>
      <div class="desc">Tỷ lệ giao đầy đủ theo mặt hàng</div>
    </a>
  </div>
  <footer>Nguồn: dashboard nội bộ H:\html · bản xem trên web</footer>
</body>
</html>
